name: csv_to_mcq_app
description: "A cross-platform Flutter application for creating, importing, practicing, and analyzing MCQ examinations with local persistence."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.0.0
  excel: ^4.0.6
  file_picker: ^10.3.7
  uuid: ^4.5.2
  csv: ^8.0.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/samples/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.jpg"
