name: csv_to_mcq_app
description: "A cross-platform Flutter application for creating, importing, practicing, and analyzing MCQ examinations with local persistence."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.0.0
  excel: ^4.0.6
  file_picker: ^10.3.7
  uuid: ^4.5.2
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/samples/

